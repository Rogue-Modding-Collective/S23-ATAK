ActionManager {
 Contexts {
  ActionContext ATAK_DeviceContext {
   Priority 45
   Flags 0xa 0
   Actions {
    Action ATAK_MapUp {
     InputSource InputSourceValue {
      FilterPreset "pressed"
      Input "keyboard:KC_UP"
     }
    }
    Action ATAK_MapDown {
     InputSource InputSourceValue {
      FilterPreset "pressed"
      Input "keyboard:KC_DOWN"
     }
    }
    Action ATAK_MapLeft {
     InputSource InputSourceValue {
      FilterPreset "pressed"
      Input "keyboard:KC_LEFT"
     }
    }
    Action ATAK_MapRight {
     InputSource InputSourceValue {
      FilterPreset "pressed"
      Input "keyboard:KC_RIGHT"
     }
    }
    Action ATAK_MapZoomIn {
     InputSource InputSourceSum {
      Sources {
       InputSourceValue {
        FilterPreset "click"
        Input "keyboard:KC_EQUALS"
        Filter InputFilterDown {
        }
       }
       InputSourceValue {
        FilterPreset "click"
        Input "keyboard:KC_ADD"
        Filter InputFilterDown {
        }
       }
      }
     }
    }
    Action ATAK_MapZoomOut {
     InputSource InputSourceSum {
      Sources {
       InputSourceValue {
        FilterPreset "click"
        Input "keyboard:KC_MINUS"
        Filter InputFilterDown {
        }
       }
       InputSourceValue {
        FilterPreset "click"
        Input "keyboard:KC_SUBTRACT"
        Filter InputFilterDown {
        }
       }
      }
     }
    }
    Action ATAK_MapCenter {
     InputSource InputSourceValue {
      FilterPreset "click"
      Input "keyboard:KC_HOME"
      Filter InputFilterDown {
      }
     }
    }
    Action ATAK_DeviceSelect {
     InputSource InputSourceValue {
      FilterPreset "click"
      Input "keyboard:KC_RETURN"
      Filter InputFilterDown {
      }
     }
    }
    Action ATAK_DeviceBack {
     InputSource InputSourceValue {
      FilterPreset "click"
      Input "keyboard:KC_BACK"
      Filter InputFilterDown {
      }
     }
    }
   }
  }
 }
}
